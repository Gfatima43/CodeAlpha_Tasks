<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Basic Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename="css/style.css") }}">
</head>
<body>
    <main class="chat-card" aria-label="Basic chatbot">
        <header class="chat-header">
            <div class="bot-mark" aria-hidden="true">☘</div>
            <div>
                <h1>Basic Chatbot</h1>
                <p class="status"><span class="status-dot"></span> Online and ready to help</p>
            </div>
        </header>
        <section id="chat-messages" class="chat-messages" aria-live="polite" aria-label="Conversation">
            <div class="message-row bot-row">
                <div class="message bot-message">Hi! How can I help you today?</div>
            </div>
        </section>
        <form id="chat-form" class="chat-form">
            <label class="sr-only" for="message-input">Type your message</label>
            <input id="message-input" name="message" type="text" autocomplete="off" placeholder="Type your message..." maxlength="500" required>
            <button type="submit" aria-label="Send message">Send <span aria-hidden="true">➤</span></button>
        </form>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
